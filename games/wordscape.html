<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        h1 { margin-bottom: 5px; font-size: 2.2rem; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .level-indicator { font-size: 0.9rem; color: #888; margin-bottom: 15px; }

        .board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 25px;
            align-items: center;
            min-height: 120px;
            justify-content: center;
        }
        .word-row {
            display: flex;
            gap: 6px;
        }
        .tile {
            width: 36px;
            height: 36px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }
        .tile.revealed {
            background-color: #33cc66;
            border-color: #28a452;
            color: #121212;
        }

        .current-input {
            height: 35px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffcc00;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Circular Letter Picker */
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            background: #1a1a1a;
            border: 4px solid #333;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .letter-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transform: translate(-50%, -50%);
            transition: background 0.1s, border-color 0.1s;
        }
        .letter-btn.selected {
            background: #ffcc00;
            border-color: #ffe066;
            color: #121212;
        }

        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn:hover { background: #333; }

        .back-link { margin-top: 15px; color: #ffcc00; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>WORD PUZZLE</h1>
    <div class="level-indicator" id="levelIndicator">Level 1</div>

    <div class="board" id="boardContainer"></div>
    <div class="current-input" id="currentInput"></div>

    <div class="wheel-container" id="wheelContainer"></div>

    <div class="actions">
        <button class="btn" onclick="clearSelection()">Clear</button>
        <button class="btn" onclick="submitWord()">Enter</button>
    </div>

    <a href="../index.html" class="back-link">← Back to Home</a>

    <script>
        const levels = [
            { letters: ["C", "A", "T", "S"], words: ["CAT", "CATS", "ACT", "SAT"] },
            { letters: ["P", "E", "A", "R"], words: ["PEAR", "PEA", "RAP", "PARE"] },
            { letters: ["B", "I", "T", "E"], words: ["BITE", "BIT", "TIE", "BET"] }
        ];

        let currentLevelIndex = 0;
        let activeLevel = null;
        let foundWords = new Set();
        let selectedIndices = [];
        let currentString = "";

        function initLevel() {
            activeLevel = levels[currentLevelIndex];
            foundWords.clear();
            document.getElementById("levelIndicator").innerText = `Level ${currentLevelIndex + 1} of ${levels.length}`;
            renderBoard();
            renderWheel();
            clearSelection();
        }

        function renderBoard() {
            const boardEl = document.getElementById("boardContainer");
            boardEl.innerHTML = "";
            activeLevel.words.forEach(word => {
                const row = document.createElement("div");
                row.className = "word-row";
                for (let i = 0; i < word.length; i++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${word}-${i}`;
                    tile.innerText = "";
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            });
        }

        function renderWheel() {
            const wheel = document.getElementById("wheelContainer");
            wheel.innerHTML = "";
            const letters = activeLevel.letters;
            const radius = 65;
            const centerX = 100;
            const centerY = 100;

            letters.forEach((letter, index) => {
                const angle = (index * 2 * Math.PI) / letters.length - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                const btn = document.createElement("div");
                btn.className = "letter-btn";
                btn.style.left = `${x}px`;
                btn.style.top = `${y}px`;
                btn.innerText = letter;
                btn.dataset.index = index;

                btn.addEventListener("mousedown", () => selectLetter(index, btn));
                btn.addEventListener("touchstart", (e) => { e.preventDefault(); selectLetter(index, btn); });

                wheel.appendChild(btn);
            });
        }

        function selectLetter(index, btn) {
            if (selectedIndices.includes(index)) return; // Prevent duplicate immediate selection
            selectedIndices.push(index);
            btn.classList.add("selected");
            currentString += activeLevel.letters[index];
            document.getElementById("currentInput").innerText = currentString;
        }

        function clearSelection() {
            selectedIndices = [];
            currentString = "";
            document.getElementById("currentInput").innerText = "";
            document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("selected"));
        }

        function submitWord() {
            if (!currentString) return;
            const word = currentString;

            if (activeLevel.words.includes(word) && !foundWords.has(word)) {
                foundWords.add(word);
                revealWord(word);
                
                if (foundWords.size === activeLevel.words.length) {
                    setTimeout(() => {
                        currentLevelIndex++;
                        if (currentLevelIndex < levels.length) {
                            alert("Level Complete! Moving to next level.");
                            initLevel();
                        } else {
                            alert("You beat all levels! 🎉");
                            currentLevelIndex = 0;
                            initLevel();
                        }
                    }, 300);
                }
            }
            clearSelection();
        }

        function revealWord(word) {
            for (let i = 0; i < word.length; i++) {
                const tile = document.getElementById(`tile-${word}-${i}`);
                if (tile) {
                    tile.innerText = word[i];
                    tile.classList.add("revealed");
                }
            }
        }

        initLevel();
    </script>
</body>
</html>
