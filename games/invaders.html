<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; color: #3399ff; text-shadow: 0 0 10px rgba(51, 153, 255, 0.5); }
        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .score-box {
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #3399ff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>SPACE INVADERS</h1>
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">Lives: <span id="lives">3</span></div>
    </div>
    <canvas id="invadersCanvas" width="480" height="400"></canvas>
    <div class="instructions">
        Use <b>Left/Right Arrows</b> (or A/D) to move. <b>Spacebar</b> to shoot.<br>Press <b>Spacebar</b> to restart when game over.
    </div>
    <a href="../index.html" class="back-link">← Back to Home</a>

    <script>
        const canvas = document.getElementById("invadersCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isVictory = false;

        let player = { x: canvas.width / 2 - 20, y: canvas.height - 40, width: 40, height: 16, speed: 5 };
        let bullets = [];
        let aliens = [];
        let alienBullets = [];

        let leftPressed = false;
        let rightPressed = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = true;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = true;
            if (e.key === " ") {
                e.preventDefault();
                if (isGameOver || isVictory) {
                    resetGame();
                } else {
                    // Shoot bullet
                    if (bullets.length < 3) {
                        bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
                    }
                }
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") leftPressed = false;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") rightPressed = false;
        });

        function initAliens() {
            aliens = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    aliens.push({
                        x: 45 + c * 50,
                        y: 40 + r * 35,
                        width: 30,
                        height: 20,
                        alive: true
                    });
                }
            }
        }
        initAliens();

        let alienDirection = 1;
        let alienSpeedTimer = 0;

        function update() {
            if (isGameOver || isVictory) return;

            // Player movement
            if (leftPressed && player.x > 0) player.x -= player.speed;
            if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;

            // Update Player Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check collision with aliens
                for (let j = 0; j < aliens.length; j++) {
                    let a = aliens[j];
                    if (a.alive && bullets[i] &&
                        bullets[i].x < a.x + a.width &&
                        bullets[i].x + bullets[i].width > a.x &&
                        bullets[i].y < a.y + a.height &&
                        bullets[i].y + bullets[i].height > a.y
                    ) {
                        a.alive = false;
                        bullets.splice(i, 1);
                        score += 20;
                        document.getElementById("score").innerText = score;

                        // Check Win
                        if (aliens.every(al => !al.alive)) {
                            isVictory = true;
                        }
                        break;
                    }
                }
            }

            // Move Aliens side-to-side and down
            alienSpeedTimer++;
            if (alienSpeedTimer > 30) {
                let hitEdge = false;
                aliens.forEach(a => {
                    if (a.alive) {
                        a.x += alienDirection * 10;
                        if (a.x + a.width >= canvas.width - 15 || a.x <= 15) {
                            hitEdge = true;
                        }
                    }
                });

                if (hitEdge) {
                    alienDirection *= -1;
                    aliens.forEach(a => {
                        a.y += 15;
                        if (a.alive && a.y + a.height >= player.y) {
                            isGameOver = true;
                        }
                    });
                }
                alienSpeedTimer = 0;
            }

            // Random Alien Shooting
            if (Math.random() < 0.02) {
                let livingAliens = aliens.filter(a => a.alive);
                if (livingAliens.length > 0) {
                    let shooter = livingAliens[Math.floor(Math.random() * livingAliens.length)];
                    alienBullets.push({ x: shooter.x + shooter.width / 2 - 2, y: shooter.y + shooter.height, width: 4, height: 10, speed: 4 });
                }
            }

            // Update Alien Bullets
            for (let i = alienBullets.length - 1; i >= 0; i--) {
                alienBullets[i].y += alienBullets[i].speed;
                if (alienBullets[i].y > canvas.height) {
                    alienBullets.splice(i, 1);
                    continue;
                }

                // Check collision with player
                let ab = alienBullets[i];
                if (
                    ab.x < player.x + player.width &&
                    ab.x + ab.width > player.x &&
                    ab.y < player.y + player.height &&
                    ab.y + ab.height > player.y
                ) {
                    alienBullets.splice(i, 1);
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    if (lives <= 0) {
                        isGameOver = true;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = "#3399ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(player.x + player.width / 2 - 3, player.y - 6, 6, 6); // Cannon

            // Draw Player Bullets
            ctx.fillStyle = "#ffffff";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Draw Aliens
            ctx.fillStyle = "#ff3366";
            aliens.forEach(a => {
                if (a.alive) ctx.fillRect(a.x, a.y, a.width, a.height);
            });

            // Draw Alien Bullets
            ctx.fillStyle = "#ffcc00";
            alienBullets.forEach(ab => ctx.fillRect(ab.x, ab.y, ab.width, ab.height));

            if (isGameOver || isVictory) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "bold 26px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText(isVictory ? "VICTORY! 🎉" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#888";
                ctx.fillText("Press Space to Play Again", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            document.getElementById("score").innerText = 0;
            document.getElementById("lives").innerText = 3;
            isGameOver = false;
            isVictory = false;
            bullets = [];
            alienBullets = [];
            player.x = canvas.width / 2 - 20;
            initAliens();
        }

        gameLoop();
    </script>
</body>
</html>
