<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pong</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        .scoreboard { font-size: 1.5rem; margin-bottom: 20px; background: #1e1e1e; padding: 8px 20px; border-radius: 8px; border: 1px solid #333; }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        
        .controls {
            display: none;
            gap: 20px;
            margin-top: 15px;
        }
        .controls button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            font-size: 1.5rem;
            width: 80px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
        }
        .controls button:active {
            background: #00ffcc;
            color: #121212;
        }

        .back-link { margin-top: 15px; color: #00ffcc; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .controls { display: flex; }
        }
    </style>
</head>
<body>
    <h1>PONG</h1>
    <div class="scoreboard"><span id="playerScore">0</span> : <span id="aiScore">0</span></div>
    <canvas id="pongCanvas" width="600" height="400"></canvas>
    
    <div class="controls">
        <button ontouchstart="movePlayer('UP')" onmousedown="movePlayer('UP')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">⬆️</button>
        <button ontouchstart="movePlayer('DOWN')" onmousedown="movePlayer('DOWN')" ontouchend="stopPlayer()" onmouseup="stopPlayer()">⬇️</button>
    </div>

    <div class="instructions">
        Player (Left): <b>W / S</b> keys or Buttons &nbsp;|&nbsp; AI (Right): Automated
    </div>
    <a href="../index.html" class="back-link">← Back to Portal</a>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        const paddleWidth = 12, paddleHeight = 80;
        let playerY = canvas.height / 2 - paddleHeight / 2;
        let aiY = canvas.height / 2 - paddleHeight / 2;
        let playerScore = 0, aiScore = 0;

        let ballX = canvas.width / 2, ballY = canvas.height / 2;
        let ballSpeedX = 5, ballSpeedY = 3;

        let keys = {};
        let touchDirection = null;

        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function movePlayer(dir) { touchDirection = dir; }
        function stopPlayer() { touchDirection = null; }

        function update() {
            // Player movement (Keyboard + Touch)
            if (((keys["w"] || keys["W"] || keys["ArrowUp"]) || touchDirection === 'UP') && playerY > 0) playerY -= 6;
            if (((keys["s"] || keys["S"] || keys["ArrowDown"]) || touchDirection === 'DOWN') && playerY < canvas.height - paddleHeight) playerY += 6;

            // Simple AI movement
            let aiCenter = aiY + paddleHeight / 2;
            if (aiCenter < ballY - 35) aiY += 4.5;
            else if (aiCenter > ballY + 35) aiY -= 4.5;
            aiY = Math.max(0, Math.min(canvas.height - paddleHeight, aiY));

            // Ball movement
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Wall collisions (Top/Bottom)
            if (ballY <= 0 || ballY >= canvas.height) ballSpeedY *= -1;

            // Paddle collisions
            if (ballX <= 20 + paddleWidth && ballY >= playerY && ballY <= playerY + paddleHeight) {
                let deltaY = ballY - (playerY + paddleHeight / 2);
                ballSpeedX *= -1.05;
                ballSpeedY = deltaY * 0.15;
                ballX = 20 + paddleWidth;
            }
            if (ballX >= canvas.width - 20 - paddleWidth && ballY >= aiY && ballY <= aiY + paddleHeight) {
                let deltaY = ballY - (aiY + paddleHeight / 2);
                ballSpeedX *= -1.05;
                ballSpeedY = deltaY * 0.15;
                ballX = canvas.width - 20 - paddleWidth;
            }

            // Scoring
            if (ballX < 0) {
                aiScore++;
                document.getElementById("aiScore").innerText = aiScore;
                resetBall();
            } else if (ballX > canvas.width) {
                playerScore++;
                document.getElementById("playerScore").innerText = playerScore;
                resetBall();
            }
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 5;
            ballSpeedY = (Math.random() * 4) - 2;
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#333";
            ctx.setLineDash([5, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(20, playerY, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ff3366";
            ctx.fillRect(canvas.width - 20 - paddleWidth, aiY, paddleWidth, paddleHeight);

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
