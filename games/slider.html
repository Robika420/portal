<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.3rem; color: #33cc99; text-shadow: 0 0 10px rgba(51, 204, 153, 0.5); }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 8px;
            background-color: #1a1a1a;
            padding: 12px;
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .tile {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 6px;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .tile.empty { background: transparent; border: none; cursor: default; }
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #33cc99; text-decoration: none; }
    </style>
</head>
<body>
    <h1>SLIDE PUZZLE</h1>
    <div class="grid" id="puzzleGrid"></div>
    <div class="instructions">Click adjacent tiles to slide them into order (1-8).</div>
    <a href="../index.html" class="back-link">← Back to Home</a>

    <script>
        let board = [1, 2, 3, 4, 5, 6, 7, 8, ""];

        function shuffle() {
            for (let i = 0; i < 100; i++) {
                let emptyIdx = board.indexOf("");
                let validMoves = [];
                let r = Math.floor(emptyIdx / 3), c = emptyIdx % 3;
                if (r > 0) validMoves.push(emptyIdx - 3);
                if (r < 2) validMoves.push(emptyIdx + 3);
                if (c > 0) validMoves.push(emptyIdx - 1);
                if (c < 2) validMoves.push(emptyIdx + 1);
                let target = validMoves[Math.floor(Math.random() * validMoves.length)];
                board[emptyIdx] = board[target];
                board[target] = "";
            }
            if (board.join() === "1,2,3,4,5,6,7,8,") shuffle();
        }

        function render() {
            const grid = document.getElementById("puzzleGrid");
            grid.innerHTML = "";
            board.forEach((val, idx) => {
                const tile = document.createElement("div");
                tile.className = `tile ${val === "" ? "empty" : ""}`;
                tile.innerText = val;
                tile.addEventListener("click", () => move(idx));
                grid.appendChild(tile);
            });
        }

        function move(idx) {
            let emptyIdx = board.indexOf("");
            let r1 = Math.floor(idx / 3), c1 = idx % 3;
            let r2 = Math.floor(emptyIdx / 3), c2 = emptyIdx % 3;
            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                board[emptyIdx] = board[idx];
                board[idx] = "";
                render();
                if (board.join() === "1,2,3,4,5,6,7,8,") {
                    setTimeout(() => alert("Puzzle Solved! 🎉"), 100);
                }
            }
        }

        shuffle();
        render();
    </script>
</body>
</html>
