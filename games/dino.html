<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .score-box {
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #ffcc00; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>DINO RUNNER</h1>
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">High Score: <span id="highScore">0</span></div>
    </div>
    <canvas id="dinoCanvas" width="600" height="250"></canvas>
    <div class="instructions">
        Press <b>Spacebar</b>, <b>Up Arrow</b>, or <b>W</b> to jump.<br>Press <b>Spacebar</b> to restart when game over.
    </div>
    <a href="../index.html" class="back-link">← Back to Portal</a>

    <script>
        const canvas = document.getElementById("dinoCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highScore = localStorage.getItem("dinoHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        let gameSpeed = 6;
        let isGameOver = false;

        // T-Rex object
        let dino = {
            x: 50,
            y: 170,
            width: 30,
            height: 40,
            vy: 0,
            gravity: 0.8,
            jumpPower: -12,
            grounded: true
        };

        // Obstacles array
        let obstacles = [];
        let spawnTimer = 0;
        let nextSpawnTime = 100;

        document.addEventListener("keydown", (e) => {
            if (["Space", "ArrowUp", "ArrowDown", " "].includes(e.key)) {
                e.preventDefault();
            }

            if ((e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W")) {
                if (isGameOver) {
                    resetGame();
                } else if (dino.grounded) {
                    dino.vy = dino.jumpPower;
                    dino.grounded = false;
                }
            }
        });

        // Click/tap support for mobile
        canvas.addEventListener("click", () => {
            if (isGameOver) {
                resetGame();
            } else if (dino.grounded) {
                dino.vy = dino.jumpPower;
                dino.grounded = false;
            }
        });

        function spawnObstacle() {
            let type = Math.random() > 0.3 ? "cactus" : "tall-cactus";
            let width = type === "cactus" ? 20 : 15;
            let height = type === "cactus" ? 35 : 50;
            
            obstacles.push({
                x: canvas.width,
                y: 210 - height,
                width: width,
                height: height
            });
        }

        function update() {
            if (isGameOver) return;

            // Score progression
            score += 0.1;
            document.getElementById("score").innerText = Math.floor(score);
            
            // Increase speed slightly over time
            gameSpeed = 6 + Math.floor(score / 100) * 0.5;

            // Dino physics
            dino.vy += dino.gravity;
            dino.y += dino.vy;

            // Ground collision
            if (dino.y > 170) {
                dino.y = 170;
                dino.vy = 0;
                dino.grounded = true;
            }

            // Obstacle spawning logic
            spawnTimer++;
            if (spawnTimer >= nextSpawnTime) {
                spawnObstacle();
                spawnTimer = 0;
                nextSpawnTime = Math.floor(Math.random() * 50) + 70 - Math.min(gameSpeed * 2, 30);
            }

            // Move and check obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // AABB Collision Detection
                if (
                    dino.x < obstacles[i].x + obstacles[i].width &&
                    dino.x + dino.width > obstacles[i].x &&
                    dino.y < obstacles[i].y + obstacles[i].height &&
                    dino.y + dino.height > obstacles[i].y
                ) {
                    isGameOver = true;
                    if (Math.floor(score) > highScore) {
                        highScore = Math.floor(score);
                        localStorage.setItem("dinoHighScore", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                }

                // Remove off-screen obstacles
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground line
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 210);
            ctx.lineTo(canvas.width, 210);
            ctx.stroke();

            // Draw Dino (Retro neon block style)
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            // Dino eye detail
            ctx.fillStyle = "#121212";
            ctx.fillRect(dino.x + 18, dino.y + 8, 4, 4);

            // Draw Obstacles
            ctx.fillStyle = "#ff3366";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "bold 24px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#888";
                ctx.fillText("Press Space to Play Again", canvas.width / 2, canvas.height / 2 + 15);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            document.getElementById("score").innerText = 0;
            gameSpeed = 6;
            obstacles = [];
            spawnTimer = 0;
            nextSpawnTime = 100;
            dino.y = 170;
            dino.vy = 0;
            dino.grounded = true;
            isGameOver = false;
        }

        gameLoop();
    </script>
</body>
</html>
