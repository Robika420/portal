<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .score-box {
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        canvas {
            background-color: #1a1a1a;
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Mobile Controls Styling (Optional) */
        .controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            margin-top: 15px;
        }

        .controls button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            font-size: 1.5rem;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
        }

        .controls button:active {
            background: #00ff66;
            color: #121212;
        }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 600px) {
            .controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">High Score: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="instructions">
        Use <b>Arrow Keys</b> or <b>W, A, S, D</b> to play.<br>Press <b>Spacebar</b> to restart when game over.
    </div>
    <a href="../index.html" class="back-link">← Back to Portal</a>

    <!-- On-screen controls for touch devices -->
    <div class="controls">
        <button class="btn-up" onclick="changeDirection('UP')">⬆️</button>
        <button class="btn-left" onclick="changeDirection('LEFT')">⬅️</button>
        <button class="btn-down" onclick="changeDirection('DOWN')">⬇️</button>
        <button class="btn-right" onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSze = 20;
        const tileCount = canvas.width / gridSze;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval;
        let changingDirection = false; // Prevents fast double-click bugs

        document.getElementById("highScore").innerText = highScore;

        // Listen for keyboard events
        document.addEventListener("keydown", handleKeyPress);

        function handleKeyPress(event) {
            const keyPressed = event.key;
            
            // Prevent scrolling with spacebar or arrow keys
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(event.key) > -1) {
                event.preventDefault();
            }

            if (keyPressed === " " && (gameOver || !gameInterval)) {
                resetGame();
                return;
            }

            if (changingDirection) return;

            if ((keyPressed === "ArrowLeft" || keyPressed === "a" || keyPressed === "A") && dx === 0) {
                dx = -1; dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowUp" || keyPressed === "w" || keyPressed === "W") && dy === 0) {
                dx = 0; dy = -1;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "D") && dx === 0) {
                dx = 1; dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "S") && dy === 0) {
                dx = 0; dy = 1;
                changingDirection = true;
            }
        }

        function changeDirection(dir) {
            if (changingDirection) return;
            if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
            if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
        }

        let gameOver = false;

        function main() {
            if (hasGameEnded()) {
                gameOver = true;
                clearInterval(gameInterval);
                drawGameOverScreen();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ff66" : "#00cc52";
                ctx.strokeStyle = "#1a1a1a";
                ctx.fillRect(part.x * gridSze, part.y * gridSze, gridSze, gridSze);
                ctx.strokeRect(part.x * gridSze, part.y * gridSze, gridSze, gridSze);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                document.getElementById("score").innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Make sure food doesn't spawn on top of the snake
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff3366";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff3366";
            ctx.fillRect(food.x * gridSze, food.y * gridSze, gridSze, gridSze);
            ctx.shadowBlur = 0; // Reset shadow
        }

        function hasGameEnded() {
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) return true;

            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function drawGameOverScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "bold 30px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

            ctx.font = "16px 'Segoe UI'";
            ctx.fillStyle = "#888";
            ctx.fillText("Press Space or Refresh to Play Again", canvas.width / 2, canvas.height / 2 + 20);
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            score = 0;
            document.getElementById("score").innerText = score;
            dx = 1;
            dy = 0;
            gameOver = false;
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, 100);
        }

        // Start the game loop initially
        generateFood();
        gameInterval = setInterval(main, 100);
    </script>
</body>
</html>
