<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Memory Match</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.3rem; color: #ff9933; text-shadow: 0 0 10px rgba(255, 153, 51, 0.5); }
        
        .scoreboard {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .score-box {
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 75px);
            grid-template-rows: repeat(4, 75px);
            gap: 12px;
            background-color: #1a1a1a;
            padding: 15px;
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, transform 0.2s;
        }
        .card:hover { border-color: #ff9933; }
        .card.flipped, .card.matched {
            background-color: #222;
            border-color: #ff9933;
        }
        .card.matched {
            border-color: #33cc66;
            opacity: 0.8;
            cursor: default;
        }

        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #ff9933; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        /* Win Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }
        .modal.active { display: flex; }
        .modal h2 { font-size: 2rem; color: #33cc66; }
        .modal button {
            background: #ff9933;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal button:hover { background: #ffaa55; }
    </style>
</head>
<body>
    <h1>MEMORY MATCH</h1>
    <div class="scoreboard">
        <div class="score-box">Moves: <span id="moves">0</span></div>
        <div class="score-box">Time: <span id="timer">0</span>s</div>
    </div>

    <div class="grid" id="gameGrid"></div>

    <div class="instructions">
        Click cards to flip and match pairs of emojis.
    </div>
    <a href="../index.html" class="back-link">← Back to Home</a>

    <!-- Win Modal -->
    <div class="modal" id="winModal">
        <h2>YOU WIN! 🎉</h2>
        <p id="finalStats" style="color: #bbb;"></p>
        <button onclick="initGame()">Play Again</button>
    </div>

    <script>
        const emojis = ["🚀", "🔥", "💻", "⚡", "🎮", "🐱", "🍕", "🎸"];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isGameStarted = false;
        let isLocked = false;

        const gridEl = document.getElementById("gameGrid");
        const movesEl = document.getElementById("moves");
        const timerEl = document.getElementById("timer");
        const modalEl = document.getElementById("winModal");
        const finalStatsEl = document.getElementById("finalStats");

        function initGame() {
            gridEl.innerHTML = "";
            modalEl.classList.remove("active");
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            isGameStarted = false;
            isLocked = false;
            movesEl.innerText = "0";
            timerEl.innerText = "0";
            clearInterval(timerInterval);

            // Duplicate emojis for pairs and shuffle
            cards = [...emojis, ...emojis]
                .sort(() => Math.random() - 0.5)
                .map((emoji, index) => ({ id: index, emoji, flipped: false, matched: false }));

            cards.forEach(card => {
                const cardEl = document.createElement("div");
                cardEl.classList.add("card");
                cardEl.dataset.id = card.id;
                cardEl.addEventListener("click", () => handleCardClick(card, cardEl));
                gridEl.appendChild(cardEl);
            });
        }

        function handleCardClick(card, cardEl) {
            if (isLocked || card.flipped || card.matched) return;

            if (!isGameStarted) {
                isGameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    timerEl.innerText = timer;
                }, 1000);
            }

            card.flipped = true;
            cardEl.classList.add("flipped");
            cardEl.innerText = card.emoji;
            flippedCards.push({ card, cardEl });

            if (flippedCards.length === 2) {
                moves++;
                movesEl.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = flippedCards;

            if (first.card.emoji === second.card.emoji) {
                first.card.matched = true;
                second.card.matched = true;
                first.cardEl.classList.add("matched");
                second.cardEl.classList.add("matched");
                flippedCards = [];
                matchedPairs++;

                if (matchedPairs === emojis.length) {
                    clearInterval(timerInterval);
                    finalStatsEl.innerText = `Completed in ${moves} moves and ${timer} seconds!`;
                    modalEl.classList.add("active");
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    first.card.flipped = false;
                    second.card.flipped = false;
                    first.cardEl.classList.remove("flipped");
                    second.cardEl.classList.remove("flipped");
                    first.cardEl.innerText = "";
                    second.cardEl.innerText = "";
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        initGame();
    </script>
</body>
</html>
