<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pinball</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        h1 { margin-bottom: 8px; font-size: 2.3rem; color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .scoreboard {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .score-box {
            background: #1e1e1e;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            gap: 15px;
            margin-top: 15px;
        }
        .controls button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            font-size: 1rem;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        .controls button:active { background: #ff3366; color: #121212; }

        .instructions { margin-top: 10px; color: #888; font-size: 0.85rem; text-align: center; }
        .back-link { margin-top: 10px; color: #ff3366; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>PINBALL</h1>
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">Balls: <span id="balls">3</span></div>
    </div>
    <canvas id="pinballCanvas" width="360" height="500"></canvas>

    <div class="controls">
        <button onpointerdown="leftFlipperActive=true" onpointerup="leftFlipperActive=false" onpointerleave="leftFlipperActive=false">⬅️ LEFT</button>
        <button onpointerdown="rightFlipperActive=true" onpointerup="rightFlipperActive=false" onpointerleave="rightFlipperActive=false">RIGHT ➡️</button>
    </div>

    <div class="instructions">Use <b>Z</b> / <b>Left Arrow</b> and <b>M</b> / <b>Right Arrow</b> (or touch buttons) to flip.</div>
    <a href="../index.html" class="back-link">← Back to Home</a>

    <script>
        const canvas = document.getElementById("pinballCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let balls = 3;
        let isGameOver = false;

        let ball = {
            x: 320,
            y: 400,
            vx: 0,
            vy: -8,
            radius: 8,
            gravity: 0.25,
            active: true
        };

        let leftFlipperAngle = 0.3;
        let rightFlipperAngle = -0.3;
        let leftFlipperActive = false;
        let rightFlipperActive = false;

        const bumpers = [
            { x: 140, y: 150, radius: 18, color: "#ffcc00", points: 100 },
            { x: 220, y: 150, radius: 18, color: "#ffcc00", points: 100 },
            { x: 180, y: 90, radius: 22, color: "#3399ff", points: 200 }
        ];

        document.addEventListener("keydown", (e) => {
            if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") leftFlipperActive = true;
            if (e.key === "m" || e.key === "M" || e.key === "ArrowRight") rightFlipperActive = true;
            if (e.key === " " && isGameOver) resetGame();
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") leftFlipperActive = false;
            if (e.key === "m" || e.key === "M" || e.key === "ArrowRight") rightFlipperActive = false;
        });

        function update() {
            if (isGameOver) return;

            // Apply gravity & velocity
            ball.vy += ball.gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Air resistance
            ball.vx *= 0.99;
            ball.vy *= 0.99;

            // Wall collisions
            if (ball.x - ball.radius < 20) { ball.x = 20 + ball.radius; ball.vx *= -0.8; }
            if (ball.x + ball.radius > canvas.width - 40) { ball.x = canvas.width - 40 - ball.radius; ball.vx *= -0.8; }
            if (ball.y - ball.radius < 20) { ball.y = 20 + ball.radius; ball.vy *= -0.8; }

            // Launch lane restriction
            if (ball.x > canvas.width - 40 && ball.y > 300 && ball.active) {
                ball.vy = -7;
            }

            // Bumper collisions
            bumpers.forEach(b => {
                let dx = ball.x - b.x;
                let dy = ball.y - b.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < ball.radius + b.radius) {
                    let angle = Math.atan2(dy, dx);
                    let force = 6;
                    ball.vx = Math.cos(angle) * force;
                    ball.vy = Math.sin(angle) * force;
                    score += b.points;
                    document.getElementById("score").innerText = score;
                }
            });

            // Flipper physics & movement
            let targetLeftAngle = leftFlipperActive ? -0.4 : 0.3;
            let targetRightAngle = rightFlipperActive ? 0.4 : -0.3;
            leftFlipperAngle += (targetLeftAngle - leftFlipperAngle) * 0.4;
            rightFlipperAngle += (targetRightAngle - rightFlipperAngle) * 0.4;

            // Left flipper collision box coordinates
            let lfPivotX = 110, lfPivotY = 430;
            let lfTipX = lfPivotX + 60 * Math.cos(leftFlipperAngle);
            let lfTipY = lfPivotY + 60 * Math.sin(leftFlipperAngle);
            checkFlipperCollision(lfPivotX, lfPivotY, lfTipX, lfTipY, leftFlipperActive);

            // Right flipper collision box coordinates
            let rfPivotX = 230, rfPivotY = 430;
            let rfTipX = rfPivotX + 60 * Math.cos(Math.PI - rightFlipperAngle);
            let rfTipY = rfPivotY + 60 * Math.sin(Math.PI - rightFlipperAngle);
            checkFlipperCollision(rfPivotX, rfPivotY, rfTipX, rfTipY, rightFlipperActive);

            // Ball out of bounds (drain)
            if (ball.y > canvas.height + 20) {
                balls--;
                document.getElementById("balls").innerText = balls;
                if (balls <= 0) {
                    isGameOver = true;
                } else {
                    resetBall();
                }
            }
        }

        function checkFlipperCollision(x1, y1, x2, y2, isActive) {
            let dx = x2 - x1;
            let dy = y2 - y1;
            let length = Math.sqrt(dx * dx + dy * dy);
            let dot = ((ball.x - x1) * dx + (ball.y - y1) * dy) / (length * length);
            let clampedDot = Math.max(0, Math.min(1, dot));
            let nearestX = x1 + clampedDot * dx;
            let nearestY = y1 + clampedDot * dy;

            let dist = Math.sqrt((ball.x - nearestX) ** 2 + (ball.y - nearestY) ** 2);
            if (dist < ball.radius) {
                ball.vy = isActive ? -9 : -4;
                ball.vx += isActive ? (dx > 0 ? 3 : -3) : 1;
            }
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Table borders / walls
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, 20, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);
            ctx.fillRect(0, 0, canvas.width, 20);

            // Bumpers
            bumpers.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Left Flipper
            ctx.save();
            ctx.translate(110, 430);
            ctx.rotate(leftFlipperAngle);
            ctx.fillStyle = "#ff3366";
            ctx.fillRect(0, -6, 65, 12);
            ctx.restore();

            // Right Flipper
            ctx.save();
            ctx.translate(230, 430);
            ctx.rotate(rightFlipperAngle);
            ctx.fillStyle = "#ff3366";
            ctx.fillRect(-65, -6, 65, 12);
            ctx.restore();

            // Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 24px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "13px 'Segoe UI'";
                ctx.fillStyle = "#888";
                ctx.fillText("Press Space to Restart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ball.x = 330;
            ball.y = 350;
            ball.vx = -1;
            ball.vy = -10;
        }

        function resetGame() {
            score = 0;
            balls = 3;
            document.getElementById("score").innerText = 0;
            document.getElementById("balls").innerText = 3;
            isGameOver = false;
            resetBall();
        }

        gameLoop();
    </script>
</body>
</html>
