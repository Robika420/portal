<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pinball</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 8px; font-size: 2.3rem; color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.4); }
        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .score-box { background: #1e1e1e; padding: 8px 16px; border-radius: 8px; border: 1px solid #333; }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        
	.controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            width: 100%;
            z-index: 100;
            pointer-events: none; /* Let clicks pass through empty space */
        }
        .controls button {
            pointer-events: auto; /* Enable clicks on buttons */
            background: rgba(37, 37, 37, 0.85);
            color: white;
            border: 2px solid #555;
            font-size: 1.5rem;
            width: 85px;
            height: 65px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        .controls button:active { background: #3399ff; color: #121212; border-color: #3399ff; }

        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #ff3366; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>PINBALL</h1>
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">Balls: <span id="balls">3</span></div>
    </div>
    <canvas id="pinballCanvas" width="360" height="520"></canvas>

    <div class="controls">
        <button onpointerdown="leftFlipperActive=true" onpointerup="leftFlipperActive=false" onpointerleave="leftFlipperActive=false">◀ FLIP</button>
        <button onpointerdown="launchBall()" style="background: #333; border-color: #ff3366;">LAUNCH</button>
        <button onpointerdown="rightFlipperActive=true" onpointerup="rightFlipperActive=false" onpointerleave="rightFlipperActive=false">FLIP ▶</button>
    </div>

    <div class="instructions">Use Z/M keys or touch buttons to flip. Press Launch to shoot ball.</div>
    <a href="../index.html" class="back-link">← Back to Portal</a>

    <script>
        const canvas = document.getElementById("pinballCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let balls = 3;
        let isGameOver = false;

        let ball = {
            x: 330,
            y: 440,
            vx: 0,
            vy: 0,
            radius: 8,
            gravity: 0.22,
            inLauncher: true
        };

        let leftFlipperAngle = 0.3;
        let rightFlipperAngle = -0.3;
        let leftFlipperActive = false;
        let rightFlipperActive = false;

        const bumpers = [
            { x: 130, y: 160, radius: 18, color: "#ffcc00", points: 100 },
            { x: 210, y: 160, radius: 18, color: "#ffcc00", points: 100 },
            { x: 170, y: 90, radius: 22, color: "#3399ff", points: 200 }
        ];

        document.addEventListener("keydown", (e) => {
            if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") leftFlipperActive = true;
            if (e.key === "m" || e.key === "M" || e.key === "ArrowRight") rightFlipperActive = true;
            if (e.key === " ") {
                e.preventDefault();
                if (isGameOver) resetGame();
                else if (ball.inLauncher) launchBall();
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "z" || e.key === "Z" || e.key === "ArrowLeft") leftFlipperActive = false;
            if (e.key === "m" || e.key === "M" || e.key === "ArrowRight") rightFlipperActive = false;
        });

        function launchBall() {
            if (ball.inLauncher && !isGameOver) {
                ball.vx = -1.5 - Math.random() * 1.5;
                ball.vy = -12 - Math.random() * 2;
                ball.inLauncher = false;
            }
        }

        function update() {
            if (isGameOver) return;

            if (!ball.inLauncher) {
                ball.vy += ball.gravity;
                ball.x += ball.vx;
                ball.y += ball.vy;

                ball.vx *= 0.995;
                ball.vy *= 0.995;

                // Wall boundaries
                if (ball.x - ball.radius < 20) { ball.x = 20 + ball.radius; ball.vx *= -0.8; }
                if (ball.x + ball.radius > canvas.width - 45) { ball.x = canvas.width - 45 - ball.radius; ball.vx *= -0.8; }
                if (ball.y - ball.radius < 20) { ball.y = 20 + ball.radius; ball.vy *= -0.8; }

                // Bumper collisions
                bumpers.forEach(b => {
                    let dx = ball.x - b.x;
                    let dy = ball.y - b.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ball.radius + b.radius) {
                        let angle = Math.atan2(dy, dx);
                        let force = 7;
                        ball.vx = Math.cos(angle) * force;
                        ball.vy = Math.sin(angle) * force;
                        score += b.points;
                        document.getElementById("score").innerText = score;
                    }
                });

                // Flippers movement
                let targetLeftAngle = leftFlipperActive ? -0.45 : 0.3;
                let targetRightAngle = rightFlipperActive ? 0.45 : -0.3;
                leftFlipperAngle += (targetLeftAngle - leftFlipperAngle) * 0.4;
                rightFlipperAngle += (targetRightAngle - rightFlipperAngle) * 0.4;

                // Flipper collisions
                checkFlipperCollision(110, 450, leftFlipperActive, -1);
                checkFlipperCollision(210, 450, rightFlipperActive, 1);

                // Drain check
                if (ball.y > canvas.height + 20) {
                    balls--;
                    document.getElementById("balls").innerText = balls;
                    if (balls <= 0) {
                        isGameOver = true;
                    } else {
                        resetBall();
                    }
                }
            }
        }

        function checkFlipperCollision(pivotX, pivotY, isActive, sideDir) {
            let dx = ball.x - pivotX;
            let dy = ball.y - pivotY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 65 && ball.y > pivotY - 20) {
                ball.vy = isActive ? -11 : -5;
                ball.vx += isActive ? sideDir * 4 : sideDir * 1;
            }
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Visible cabinet borders and launcher lane separator
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Launcher Lane Wall Divider
            ctx.beginPath();
            ctx.moveTo(canvas.width - 45, 60);
            ctx.lineTo(canvas.width - 45, canvas.height - 60);
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Bumpers
            bumpers.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Left Flipper
            ctx.save();
            ctx.translate(110, 450);
            ctx.rotate(leftFlipperAngle);
            ctx.fillStyle = "#ff3366";
            ctx.fillRect(0, -6, 60, 12);
            ctx.restore();

            // Right Flipper
            ctx.save();
            ctx.translate(210, 450);
            ctx.rotate(rightFlipperAngle);
            ctx.fillStyle = "#ff3366";
            ctx.fillRect(-60, -6, 60, 12);
            ctx.restore();

            // Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();

            if (ball.inLauncher && !isGameOver) {
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 13px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("PRESS LAUNCH", canvas.width - 27, 280);
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 24px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "13px 'Segoe UI'";
                ctx.fillStyle = "#888";
                ctx.fillText("Press Space to Restart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ball.x = 330;
            ball.y = 440;
            ball.vx = 0;
            ball.vy = 0;
            ball.inLauncher = true;
        }

        function resetGame() {
            score = 0;
            balls = 3;
            document.getElementById("score").innerText = 0;
            document.getElementById("balls").innerText = 3;
            isGameOver = false;
            resetBall();
        }

        gameLoop();
    </script>
</body>
</html>
