<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tetris</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; color: #cc66ff; text-shadow: 0 0 10px rgba(204, 102, 255, 0.5); }
        
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .score-box {
            background: #1e1e1e;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 1.1rem;
            min-width: 120px;
            text-align: center;
        }

        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        
        .controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
            margin-top: 15px;
        }
        .controls button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            font-size: 1.2rem;
            height: 50px;
            border-radius: 6px;
            cursor: pointer;
        }
        .controls button:active { background: #cc66ff; color: #121212; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-rot { grid-column: 2; grid-row: 1; }

        .back-link { margin-top: 15px; color: #cc66ff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .game-container { flex-direction: column; align-items: center; }
            .controls { display: grid; }
        }
    </style>
</head>
<body>
    <h1>TETRIS</h1>
    
    <div class="game-container">
        <canvas id="tetrisCanvas" width="240" height="400"></canvas>
        <div class="side-panel">
            <div class="score-box">Score<br><span id="score" style="font-weight: bold; font-size: 1.3rem;">0</span></div>
            <div class="score-box">Lines<br><span id="lines" style="font-weight: bold; font-size: 1.3rem;">0</span></div>
            <div class="score-box">Level<br><span id="level" style="font-weight: bold; font-size: 1.3rem;">1</span></div>
        </div>
    </div>

    <!-- On-screen controls for mobile -->
    <div class="controls">
        <button class="btn-rot" onclick="rotatePiece()">🔄</button>
        <button class="btn-left" onclick="movePiece(-1)">⬅️</button>
        <button class="btn-down" onclick="dropPiece()">⬇️</button>
        <button class="btn-right" onclick="movePiece(1)">➡️</button>
    </div>

    <div class="instructions">
        <b>Arrow Keys</b> or <b>A/D</b> to move/drop. <b>Up Arrow</b> to rotate.<br>Press <b>Spacebar</b> to restart when game over.
    </div>
    <a href="index.html" class="back-link">← Back to Home</a>

    <script>
        const canvas = document.getElementById("tetrisCanvas");
        const ctx = canvas.getContext("2d");
        const BLOCK_SIZE = 20;
        const COLS = 12;
        const ROWS = 20;

        let score = 0;
        let lines = 0;
        let level = 1;
        let isGameOver = false;

        let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

        const SHAPES = [
            [],
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[0, 1, 1], [1, 1, 0]], // S
            [[1, 1, 0], [0, 1, 1]], // Z
            [[1, 0, 0], [1, 1, 1]], // J
            [[0, 0, 1], [1, 1, 1]]  // L
        ];

        const COLORS = [
            null,
            "#00f0f0", // Cyan
            "#f0f000", // Yellow
            "#a000f0", // Purple
            "#00f000", // Green
            "#f00000", // Red
            "#0000f0", // Blue
            "#f0a000"  // Orange
        ];

        let currentPiece = {
            shape: null,
            colorIndex: 0,
            x: 0,
            y: 0
        };

        function spawnPiece() {
            let id = Math.floor(Math.random() * 7) + 1;
            currentPiece.shape = SHAPES[id];
            currentPiece.colorIndex = id;
            currentPiece.x = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentPiece.y = 0;

            if (checkCollision(0, 0, currentPiece.shape)) {
                isGameOver = true;
            }
        }

        function checkCollision(offsetX, offsetY, shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = currentPiece.x + c + offsetX;
                        let newY = currentPiece.y + r + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && grid[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function mergePiece() {
            currentPiece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        let targetY = currentPiece.y + r;
                        if (targetY >= 0) {
                            grid[targetY][currentPiece.x + c] = currentPiece.colorIndex;
                        }
                    }
                });
            });
        }

        function clearLines() {
            let cleared = 0;
            outer: for (let r = ROWS - 1; r >= 0; r--) {
                for (let c = 0; c < COLS; c++) {
                    if (!grid[r][c]) continue outer;
                }
                grid.splice(r, 1);
                grid.unshift(Array(COLS).fill(0));
                cleared++;
                r++; // Check same row index again
            }

            if (cleared > 0) {
                lines += cleared;
                score += [0, 40, 100, 300, 1200][cleared] * level;
                level = Math.floor(lines / 10) + 1;
                document.getElementById("score").innerText = score;
                document.getElementById("lines").innerText = lines;
                document.getElementById("level").innerText = level;
            }
        }

        function movePiece(dir) {
            if (isGameOver) return;
            if (!checkCollision(dir, 0, currentPiece.shape)) {
                currentPiece.x += dir;
            }
        }

        function dropPiece() {
            if (isGameOver) return;
            if (!checkCollision(0, 1, currentPiece.shape)) {
                currentPiece.y++;
            } else {
                mergePiece();
                clearLines();
                spawnPiece();
            }
        }

        function rotatePiece() {
            if (isGameOver) return;
            let rotated = currentPiece.shape[0].map((_, index) =>
                currentPiece.shape.map(row => row[index]).reverse()
            );
            if (!checkCollision(0, 0, rotated)) {
                currentPiece.shape = rotated;
            }
        }

        document.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") movePiece(-1);
            else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") movePiece(1);
            else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dropPiece();
            else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") rotatePiece();
            else if (e.key === " " && isGameOver) resetGame();
        });

        let dropCounter = 0;
        let dropInterval = 500;
        let lastTime = 0;

        function update(time = 0) {
            if (isGameOver) {
                drawGameOver();
                return;
            }

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            let currentInterval = Math.max(100, dropInterval - (level - 1) * 40);
            if (dropCounter > currentInterval) {
                dropPiece();
                dropCounter = 0;
            }

            draw();
            requestAnimationFrame(update);
        }

        function drawBlock(x, y, colorIndex) {
            ctx.fillStyle = COLORS[colorIndex];
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = "#121212";
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            grid.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) drawBlock(c, r, value);
                });
            });

            // Draw current active piece
            if (currentPiece.shape) {
                currentPiece.shape.forEach((row, r) => {
                    row.forEach((value, c) => {
                        if (value) {
                            drawBlock(currentPiece.x + c, currentPiece.y + r, currentPiece.colorIndex);
                        }
                    });
                });
            }
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "bold 22px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

            ctx.font = "12px 'Segoe UI'";
            ctx.fillStyle = "#888";
            ctx.fillText("Press Space to Play Again", canvas.width / 2, canvas.height / 2 + 15);
        }

        function resetGame() {
            grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            document.getElementById("score").innerText = 0;
            document.getElementById("lines").innerText = 0;
            document.getElementById("level").innerText = 1;
            isGameOver = false;
            spawnPiece();
            update();
        }

        spawnPiece();
        update();
    </script>
</body>
</html>
