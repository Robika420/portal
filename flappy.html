<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; color: #ff5555; text-shadow: 0 0 10px rgba(255, 85, 85, 0.5); }
        .scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .score-box {
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas { background-color: #1a1a1a; border: 4px solid #333; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .instructions { margin-top: 15px; color: #888; font-size: 0.9rem; text-align: center; }
        .back-link { margin-top: 15px; color: #ff5555; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>FLAPPY BIRD</h1>
    <div class="scoreboard">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">High Score: <span id="highScore">0</span></div>
    </div>
    <canvas id="flappyCanvas" width="400" height="500"></canvas>
    <div class="instructions">
        Press <b>Spacebar</b> or Click/Tap to Jump.<br>Press <b>Spacebar</b> to restart when game over.
    </div>
    <a href="index.html" class="back-link">← Back to Home</a>

    <script>
        const canvas = document.getElementById("flappyCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highScore = localStorage.getItem("flappyHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        let isGameOver = false;

        let bird = {
            x: 80,
            y: 200,
            width: 28,
            height: 24,
            gravity: 0.55,
            lift: -9,
            velocity: 0
        };

        let pipes = [];
        let pipeWidth = 55;
        let pipeGap = 130;
        let frameCount = 0;

        document.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "ArrowUp") {
                e.preventDefault();
                if (isGameOver) resetGame();
                else bird.velocity = bird.lift;
            }
        });

        canvas.addEventListener("click", () => {
            if (isGameOver) resetGame();
            else bird.velocity = bird.lift;
        });

        function spawnPipe() {
            let minHeight = 50;
            let maxHeight = canvas.height - pipeGap - 100;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function update() {
            if (isGameOver) return;

            frameCount++;
            if (frameCount % 90 === 0) {
                spawnPipe();
            }

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Ground & Ceiling collision
            if (bird.y + bird.height >= canvas.height - 20) {
                bird.y = canvas.height - 20 - bird.height;
                triggerGameOver();
            }
            if (bird.y <= 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            // Move and check pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 3;

                // Collision detection
                if (
                    bird.x < pipes[i].x + pipeWidth &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                ) {
                    triggerGameOver();
                }

                // Scoring
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    score++;
                    document.getElementById("score").innerText = score;
                    pipes[i].passed = true;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("flappyHighScore", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                }

                // Remove off-screen pipes
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
        }

        function draw() {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground baseline
            ctx.fillStyle = "#333";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Draw Pipes
            ctx.fillStyle = "#33cc66";
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });

            // Draw Bird
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            // Bird eye
            ctx.fillStyle = "#121212";
            ctx.fillRect(bird.x + 18, bird.y + 6, 4, 4);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "bold 28px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#888";
                ctx.fillText("Press Space to Play Again", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            document.getElementById("score").innerText = 0;
            bird.y = 200;
            bird.velocity = 0;
            pipes = [];
            frameCount = 0;
            isGameOver = false;
        }

        gameLoop();
    </script>
</body>
</html>
